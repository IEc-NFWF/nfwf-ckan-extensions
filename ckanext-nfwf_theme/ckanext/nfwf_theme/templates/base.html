{% ckan_extends %}

{% block styles %}
  {{ super() }}
  {% asset 'nfwf_theme/nfwf_theme' %}
  <!-- Extra link to help render select2 -->
  <link rel="stylesheet" href="{{ h.url_for_static('/base/vendor/select2/select2.css') }}">
{% endblock %}
{% block scripts %}
  {{ super() }}
  <!-- Global site tag (gtag.js) - Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=UA-172162518-1"></script>
  <script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'UA-172162518-1');
  </script>

  <!-- Script to help render select2 -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var initializationComplete = false;
      
      // Wait for CKAN to be available
      var checkCKAN = setInterval(function() {
        if (window.ckan && window.ckan.module && typeof window.ckan.module.initialize === 'function') {
          clearInterval(checkCKAN);
          
          // Load all modules in parallel
          var moduleScripts = [
            '/base/javascript/modules/autocomplete.js',
            '/base/javascript/modules/basic-form.js',
            '/base/javascript/modules/confirm-action.js',
            '/base/javascript/modules/copy-into-buffer.js',
            '/base/javascript/modules/custom-fields.js',
            '/base/javascript/modules/data-viewer.js',
            '/base/javascript/modules/dataset-visibility.js',
            '/base/javascript/modules/image-upload.js',
            '/base/javascript/modules/media-grid.js',
            '/base/javascript/modules/metadata-button.js',
            '/base/javascript/modules/resource-form.js',
            '/base/javascript/modules/resource-reorder.js',
            '/base/javascript/modules/resource-upload-field.js',
            '/base/javascript/modules/resource-view-embed.js',
            '/base/javascript/modules/resource-view-filters-form.js',
            '/base/javascript/modules/resource-view-filters.js',
            '/base/javascript/modules/resource-view-reorder.js',
            '/base/javascript/modules/select-switch.js',
            '/base/javascript/modules/slug-preview.js',
            '/base/javascript/modules/table-selectable-rows.js',
            '/base/javascript/modules/table-toggle-more.js'
          ];
          
          var loadedCount = 0;
          var totalModules = moduleScripts.length;
          
          moduleScripts.forEach(function(src) {
            var script = document.createElement('script');
            script.src = src;
            script.onload = function() {
              loadedCount++;
              // console.log('Loaded:', src, '(' + loadedCount + '/' + totalModules + ')');
              
              // Initialize once when all modules are loaded
              if (loadedCount === totalModules && !initializationComplete) {
                initializationComplete = true;
                
                try {
                  ckan.module.initialize();
                  // console.log('CKAN modules initialized successfully');
                  
                  // Setup select2
                  if (window.jQuery && jQuery.fn.select2) {
                    jQuery('select[multiple]').each(function() {
                      if (!jQuery(this).hasClass('select2-hidden-accessible')) {
                        jQuery(this).select2({
                          width: '100%',
                          placeholder: 'Select options...',
                          allowClear: true
                        });
                      }
                    });
                  }
                } catch (error) {
                  console.error('Initialization error:', error);
                }
              }
            };
            
            // Log errors loading modules
            script.onerror = function() {
              console.warn('Failed to load:', src);
              loadedCount++;
              if (loadedCount === totalModules && !initializationComplete) {
                initializationComplete = true;
                try {
                  ckan.module.initialize();
                  console.log('CKAN modules initialized (with some failures)');
                } catch (error) {
                  console.error('Fallback initialization error:', error);
                }
              }
            };
            
            document.head.appendChild(script);
          });
        }
      }, 100);
    });
  </script>

  <!-- Clear facet session state when leaving the dataset search page -->
  <script>
    (function() {
      var path = window.location.pathname;
      var isDatasetSearchPage = (path === '/dataset' || path === '/dataset/');
      if (!isDatasetSearchPage) {
        try {
          sessionStorage.removeItem('ckan_facet_on_dataset_page');
          sessionStorage.removeItem('ckan_facet_expanded_state');
        } catch(e) {}
      }
      var isGroupPage = path.indexOf('/group/') === 0;
      if (!isGroupPage) {
        try {
          sessionStorage.removeItem('ckan_facet_on_group_page');
          sessionStorage.removeItem('ckan_facet_expanded_state');
        } catch(e) {}
      }
    })();
  </script>
{% endblock %}
