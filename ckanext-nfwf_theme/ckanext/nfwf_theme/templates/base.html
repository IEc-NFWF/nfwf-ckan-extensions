{% ckan_extends %}

{% block styles %}
  {{ super() }}
  {% asset 'nfwf_theme/nfwf_theme' %}
  <!-- Extra link to help render select2 -->
  <link rel="stylesheet" href="{{ h.url_for_static('/base/vendor/select2/select2.css') }}">
{% endblock %}
{% block scripts %}
  {{ super() }}
  <!-- Global site tag (gtag.js) - Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=UA-172162518-1"></script>
  <script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'UA-172162518-1');
  </script>

  <!-- Restyle multi-selects once CKAN's modules (autocomplete among them) have set them up.
       The modules themselves load from the base/ckan asset in page.html, and CKAN initializes
       them exactly once; loading and initializing them again here duplicated every module. -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      if (!window.ckan || !ckan.module) return;
      var initialize = ckan.module.initialize;
      ckan.module.initialize = function() {
        var result = initialize.apply(this, arguments);
        if (window.jQuery && jQuery.fn.select2) {
          jQuery('select[multiple]').select2({
            width: '100%',
            placeholder: 'Select options...',
            allowClear: true
          });
        }
        return result;
      };
    });
  </script>

  <!-- Clear facet session state when leaving the dataset search page -->
  <script>
    (function() {
      var path = window.location.pathname;
      var isDatasetSearchPage = (path === '/dataset' || path === '/dataset/');
      if (!isDatasetSearchPage) {
        try {
          sessionStorage.removeItem('ckan_facet_on_dataset_page');
          sessionStorage.removeItem('ckan_facet_expanded_state');
        } catch(e) {}
      }
      var isGroupPage = path.indexOf('/group/') === 0;
      if (!isGroupPage) {
        try {
          sessionStorage.removeItem('ckan_facet_on_group_page');
          sessionStorage.removeItem('ckan_facet_expanded_state');
        } catch(e) {}
      }
    })();
  </script>
{% endblock %}
