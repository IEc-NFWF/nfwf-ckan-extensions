  <!-- Concussion Mode Implementation -->
  <style>
    /* Concussion Mode CSS */
    body.concussion-mode::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 9998;
      background-color: rgba(255, 0, 0, 0.15);
      mix-blend-mode: multiply;
    }
    
    body.concussion-mode {
      filter: sepia(30%) hue-rotate(340deg) saturate(140%);
    }
    
    /* Toggle Button Styling */
    #concussion-toggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #f5f5f5;
      color: #333;
      border: 2px solid #ddd;
      border-radius: 4px;
      padding: 10px 15px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      cursor: pointer;
      z-index: 9999;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      transition: all 0.3s ease;
    }
    
    #concussion-toggle:hover {
      background-color: #eaeaea;
    }
    
    #concussion-toggle.active {
      background-color: #ffcccc;
      border-color: #ff8888;
    }
  </style>

  <button id="concussion-toggle">Enable Concussion Mode</button>

  <script async>
    (function() {
      // Get the toggle button
      const toggleButton = document.getElementById('concussion-toggle');
      
      // Check if concussion mode was previously enabled (using localStorage)
      const isConcussionModeEnabled = localStorage.getItem('concussionMode') === 'true';
      
      // Apply previous state if it exists
      if (isConcussionModeEnabled) {
        document.body.classList.add('concussion-mode');
        toggleButton.classList.add('active');
        toggleButton.textContent = 'Disable Concussion Mode';
      }
      
      // Add click event listener to toggle button
      toggleButton.addEventListener('click', function() {
        // Toggle concussion mode class on body
        document.body.classList.toggle('concussion-mode');
        
        // Update button state
        const isEnabled = document.body.classList.contains('concussion-mode');
        toggleButton.classList.toggle('active', isEnabled);
        toggleButton.textContent = isEnabled ? 'Disable Concussion Mode' : 'Enable Concussion Mode';
        
        // Save state to localStorage
        localStorage.setItem('concussionMode', isEnabled);
      });
    })();
  </script>
  {% endif %}
